name: SSMT Live Trader (DEMO ACCOUNT)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ssmt-trader-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run strategy check
        env:
          DRY_RUN: "false"
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Keep run_log.csv from growing unbounded
        run: |
          if [ -f run_log.csv ]; then
            tail -n 2000 run_log.csv > run_log.csv.tmp && mv run_log.csv.tmp run_log.csv
          fi

      - name: Commit updated state
        run: |
          git config user.name "ssmt-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json run_log.csv
          git diff --cached --quiet || git commit -m "Update state [skip ci]"
          git push
